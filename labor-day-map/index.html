<style>
    :root { color-scheme: light; font-family: Inter, Segoe UI, Arial, sans-serif; color: #17211d; background: #f7f4ed; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; min-width: 0; }
    aside { width: 360px; flex: 0 0 360px; box-sizing: border-box; height: 100vh; padding: 18px; background: #f7f4ed; border-right: 1px solid #d8d1c5; overflow: auto; }
    h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: 0; }
    .sub { margin: 0 0 16px; color: #526159; line-height: 1.35; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat { background: #fffaf2; border: 1px solid #ded4c3; border-radius: 8px; padding: 10px; }
    .stat b { display: block; font-size: 22px; }
    .stat span { font-size: 12px; color: #637167; }
    .camp { background: #fffaf2; border: 1px solid #ded4c3; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .camp h2 { font-size: 16px; margin: 0 0 4px; letter-spacing: 0; }
    .camp p { margin: 4px 0; color: #526159; font-size: 13px; line-height: 1.35; }
    .camp button, .camp a { display: inline-flex; align-items: center; min-height: 32px; margin-top: 8px; margin-right: 6px; border-radius: 6px; border: 1px solid #ac8f5f; background: #f2d9a3; color: #1f2a24; padding: 0 10px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .camp button { font: inherit; font-weight: 700; }
    #map { flex: 1 1 auto; min-width: 0; height: 100vh; }
    .site-list { color: #17211d; font-weight: 700; }
    .count-marker { display: grid; place-items: center; border: 2px solid #17211d; border-radius: 999px; color: white; font-weight: 900; box-shadow: 0 2px 8px rgba(0,0,0,.28); }
    .count-marker.p1 { background: #1f7a4d; }
    .count-marker.p2 { background: #2c6fb7; }
    .count-marker.p3 { background: #9a5a18; }
    .leaflet-popup-content { min-width: 250px; }
    .popup-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .popup-meta { color: #526159; margin-bottom: 8px; }
    .popup-sites { max-height: 130px; overflow: auto; background: #f7f4ed; border: 1px solid #ded4c3; border-radius: 6px; padding: 8px; margin: 8px 0; }
    .popup-link { color: #8b4b21; font-weight: 800; }
    @media (max-width: 760px) { html, body { overflow: auto; } body { display: flex; flex-direction: column; } #map { order: 1; height: 58vh; width: 100%; } aside { order: 2; width: 100%; height: auto; border-right: 0; border-top: 1px solid #d8d1c5; } }
  </style>

<body>
  <aside>
    <h1>Labor Day Open Sites</h1>
    <p class="sub">Same Sierra target list as the July 4 monitor. Dates checked: Sep 4, 2026 to Sep 7, 2026. Availability can disappear before checkout.</p>
    <div class="stats">
      <div class="stat"><b>70</b><span>open sites</span></div>
      <div class="stat"><b>6</b><span>campgrounds</span></div>
    </div>
    <div id="campList"></div>
  </aside>
  <main id="map" aria-label="Map of open Labor Day campsites"></main>
